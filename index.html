for(l=0;l<LV(d);l++){if(TQ[d].pf&&TQ[d].pf<3&&LV(d)>5&&l%5===0)h+='<h2>Scent set '+(l/5+1)+', stages '+(l+1)+' to '+(l+5)+'</h2>';lv=tourLvl(d,l,hm);s=tcs(d,hm,l);h+=b('tl',d+','+l+','+hm,'Stage '+(l+1)+'. '+lv.n+'. '+lv.s+' '+(tlOpen(d,hm,l)?(s?s+(s>1?' stars':' star')+' earned.':'Not cleared yet.'):'Locked.'));}
return h+BK;},

.stock&&S.stock[it.k])||0);h+=b('buy',it.k,n+', '+sp(it)+' coins. '+(it.s||PW[it.k].s)+' You own '+own+'.');}return h+BK;},
whatsnew:function(){return '<h1 tabindex="-1">What’s New</h1>'+BK.replace('b_go_home','b_go_home_top')+'<ul><li>New High Roller Vault tab in the Mini Shop, for people who win big in the Casino Hub. It has bigger Trial Ticket packs of 25 and 50, the Jackpot Power Pack, Lucky Seven Lives, the High Roller Mega Pack, luxury Golden outfits for all five front page players, and five new animated trails: Golden Cascade, Diamond Dust, Jackpot Rain, Platinum Comet and Mega Jackpot. There are also ultra luxury outfits for all five front page players, and four permanent upgrades you buy once: Golden Wallet (10 percent more coins from every run), Lucky Pair Charm (better pairs in Mega Jackpot Slots), Wheel Pass (the Lucky Wheel costs 50 coins) and Head Start Engine (every normal run starts with a Coin Magnet).</li><li>New in the Casino Hub: Mega Jackpot Slots, in its own Coin casino section below the prize wheels. Wager 50, 100, 250 or 500 coins and win coins instead of power-ups. Three Sevens win the Mega Jackpot, a pot that starts at 5000 coins and grows with every spin until someone hits it. Spend your winnings in the Mini Shop on outfits, trails, sounds, power-ups and Trial Tickets.</li><li>The Producer in the Cologne District has a new ability, Rhythm Lock. The longer you survive without hitting anything, the louder the background beat gets and the faster your score multiplier builds, up to times five. Hitting an obstacle breaks the rhythm. He still has Crossfade too.</li><li>Two new players on the front page. The Card Counter has a slightly better chance of the jackpot on the Lucky Wheel, and the first power-up you pick up in every run is always top-tier: Ghost Train, Jetpack or Hoverboard. The Phantom is a glitchy, see-through runner with a Soft Crash: when you hit an obstacle while carrying coins, you drop all your coins from that run instead of crashing. Each has their own outfits and trails in the Cosmetics tab of the Mini Shop.</li><li>Players, Events, the Casino Hub, Store Hub, Challenge Hub, Practice Hub, How to Play, Settings and What’s New now each have their own Back to home button at the top, as well as at the bottom. You can get out without scrolling all the way down to go back to home.</li><li>The Hacker has a second special ability, Backdoor: in every regular City Tour district, each stage gives you 20 percent more steps to finish. It does not apply in the special districts, the Perfume, Cologne, Dessert and Sugar Sugar districts and the Sugar Sugar Stroll Garden.</li><li>Favorite districts: there are five special districts in total, and you can choose the three you play the most as your favorites.</li><li>With VoiceOver on, Back to home and the other buttons on the Run over, Trial and Paused screens now only do what they say. They no longer start or resume a run.</li><li>The City Tour now has a back button at the top as well as the bottom.</li><li>Pause menu: End run now sits further from Resume, and tapping End run can no longer be treated as a tap to resume, so ending a run works in every mode and district.</li><li>The Mini Shop now has a Back to Store Hub button at the top as well as the bottom.</li><li>The Casino District and the Retro Arcade District have been removed from the City Tour. The Casino District Pack discount and the Retro Arcade outfits and trails are gone from the Mini Shop too. The Perfume District Shop and the Cologne District Shop stay inside their own districts.</li><li>Bigger Pause: with VoiceOver off, Pause is now a large button across the top right of the screen, so tapping anywhere in the top right corner pauses the run. Status is the smaller button on the left.</li><li>Pause fix: found why Pause only worked sometimes. For under a second after you resumed a run, Pause was ignored. Now Pause works on the first tap at any moment of a run, including right after resuming.</li><li>New in Settings: Favorite districts. Choose up to four special districts, including the Sugar Sugar Stroll Garden, as favorites, then go straight to any of them from Settings or from the top of the City Tour, without cycling through the whole list.</li><li>Pause fix for VoiceOver off: the Pause button now pauses the moment you lift your finger on it, even when the phone does not send a normal tap, and it sits above everything else on the screen. Slide your finger away before lifting to cancel.</li><li>The front page now has only three players: The Hacker, The Free-Runner and The High Roller. Nova, Kestrel, Bruno, Orion, Lyra and The VJ were removed, along with their outfits and trails in the Mini Shop. If you were running as one of them, the game switches you to The Hacker.</li><li>All the Perfume and Cologne trails are now in their own trail packs inside the Perfume District Shop and the Cologne District Shop, and are gone from the Mini Shop. They only show on their own players.</li><li>The DJ, the Perfume players and the Cologne players no longer have outfits in the Mini Shop. Their outfits now live in their own district shops, and every player has new outfits that match their own style, from the DJ’s stage suits to the Perfume players’ gowns and the Cologne players’ tuxedos.</li><li>New: the Perfume District players have their own customized shop inside the Perfume District, and the Cologne District players have their own customized shop inside the Cologne District. Both shops are separate from the Mini Shop on the front page and from each other. Each has its own outfits, trail pack, lucky charms and the Double Down token.</li><li>Details on the separate shops. The Perfume District has its own Perfume District Shop just for the Perfume players, with luxury evening gowns, trails and charms, and the Cologne District has its own Cologne District Shop just for the Cologne players, with luxury tuxedos, trails and charms. Spend your coins there. Outfits are worn in each player’s own district, and the Double Down token, which permanently doubles your future coin rewards, works everywhere.</li><li>Pause is now a single deliberate tap on the Pause button only, so it can no longer trigger by accident. The two-finger pause and the touch-down pause were removed because they were too sensitive. The Status and Pause row stays lowered away from the top edge of the phone, so it does not clash with the notification center swipe.</li><li>With the built-in voice, the Status and Pause buttons now sit lower on the run screen, away from the very top edge of the phone, so they are easier to reach and tap. Pause is also faster to respond.</li><li>Ask the Coach has been removed from the whole game, including the Practice Hub, the pause menu and the run screen, because it got in the way of the Pause button for blind and low-vision players. The Pause button now sits right next to Status. The Voice coach setting, which speaks cues during a run, is not affected.</li><li>Accessibility bug testing: every screen and button, and every mode, district and player, was tested and fixed for blind and low-vision players. Fixes: district players now only run in their own districts, the Sugar Sugar Garden no longer drops you into a normal stage, no two buttons share the same internal name on the What’s New screen, a bad saved player now resets to Nova, and the player instructions now say to choose district players on the screen of that district. What’s New also has a Back to home button at the top.</li><li>The Sugar Sugar Stroll Garden is now its own place in City Tour, separate from the Sugar Sugar District. The district has only the five Normal and five Hard stages, with its own players. The Garden is a slow, peaceful, unlimited walk with its own screen and its own players, and no Trial Tickets.</li><li>Districts now only allow their own district players. The players on the front page cannot run in the Perfume, Cologne, Dessert or Sugar Sugar districts. Each district has its own players, chosen on the screen of that district, and the first one runs until you choose another. If you pick a player on the Players screen, you now get a warning that you cannot use that player in a district.</li><li>Every City Tour district now says stages instead of levels: Stage 1 to Stage 5 in Normal and in Hard, "Stage complete", "Next stage", "Back to stages" and all the lock messages. The Sugar Sugar District fast run now has five Normal and five Hard stages like the other districts, and the Stroll Garden is a separate unlimited walk.</li><li>You now hear your own footsteps in every run, so the game feels more real. They are light and quiet so they never cover the obstacle sounds. In the Sugar Sugar Stroll Garden they are slower, softer walking steps. You can turn footsteps off in Settings.</li><li>The Sugar Sugar District has two ways to play. The Stroll Garden is a slow, peaceful, unlimited walk with no obstacles and the sound of your footsteps, open from the start with no Trial Tickets. The fast run has five stages in Normal and five in Hard, like the other districts. In both you gather sweet treats, wade through the chocolate rivers and find golden tickets, the mega jackpot.</li><li>In the Sugar Sugar District, the golden ticket is now the mega jackpot. Each one pays 100, 250, 500 or even 1000 coins straight to your wallet, plus a Trial Ticket, with the mega jackpot chime.</li><li>Stroll mode and the Stroll Garden in the Sugar Sugar District are now completely peaceful: no obstacles, no hoverboards, no ghost trains, no power-ups and no mystery boxes. The sweet treats are the only pickups, and they give you coins and a gentle coin magnet. The only special item is the golden ticket, which is the mega jackpot. Run mode is unchanged.</li><li>The Sugar Sugar District now has chocolate rivers and golden tickets. A chocolate river fills all three lanes, so you have to jump it. A golden ticket waits on the other side, in a random lane. It is the mega jackpot: 100, 250, 500 or even 1000 coins and a Trial Ticket.</li><li>New Retro Arcade District in City Tour, with five stages in Normal and five in Hard in Akihabara, Brighton, Santa Monica, Busan and Leipzig. The obstacles are arcade machines. Four new players for this district only, chosen on the district screen: The High Scorer (a speed boost every 12 coins), The Pixel (phases through barriers for 4 steps every 16 steps), The Joystick (safe for one step after every lane change) and The Glitch (scrambles nearby obstacles every 12 steps). Each has five outfits, a signature look and four new trails in the Cosmetics tab of the Mini Shop.</li><li>To choose your player for the Perfume District, the Cologne District, the Dessert District and the Sugar Sugar District, open that district in City Tour. Each district has its own players section at the top of its screen, and that is where you choose them. They are not on the Players screen.</li><li>The Perfume District and the Cologne District now have five stages in Normal and five in Hard, like the other districts, so they are easier to get through. All the popular perfume and cologne scents are still there and still change every time you play.</li><li>Four new players for the Dessert District only: The Pastry Chef (throws a rolling pin every 10 steps to clear the obstacle ahead), The Baker (a flour trail slows down the obstacles), The Decorator (frosted barriers are brittle, so you smash through them for bonus coins) and The Sweet Tooth (a spun sugar shield after collecting any dessert). Choose them on the screen of that district. Each has five outfits, a signature look with an animated accessory, and four new trails in the Cosmetics tab of the Mini Shop.</li><li>New Sugar Sugar District in the Flavor category, a calm chocolate river with sweet treats like gummy bears, rock candy and chocolate truffles. Four new players for this district only: The Confectioner (an obstacle that would crash you is coated in hard candy and becomes a speed boost), The Soda Jerk (a fizzy trail slows down the obstacles), The Chocolatier (melts through low barriers and overhead bars) and The Sugar Rush (a massive speed boost after each treat, then a brief slowdown). Choose them on the district screen. Each has five outfits, a signature look with an animated accessory, and four new trails in the Cosmetics tab of the Mini Shop.</li><li>New Flavor category in City Tour, below Fragrance, with the Dessert District: five stages in Normal and five in Hard, in Lyon, Salzburg, Gaziantep, Mexico City and Bruges. The dessert changes every time you play, from more than fifty, each giving a different flavor power-up. Each city’s local treat shows up often. The obstacles are sweets. It is open from the start.</li><li>Three new players for the Cologne District only, joining The DJ: The Producer (crossfade two different cologne power-ups to double how long both last), The Remixer (an obstacle that would crash you turns into a Dash speed boost, once every 12 steps) and The Selector (lock in which cologne scent a stage will have before you start). Choose them on the screen of that district. Each has five outfits, a signature look with an animated DJ accessory, and four new trails, all in the Cosmetics tab of the Mini Shop.</li><li>New Cologne District in City Tour, right below the Perfume District. It works the same way, with five stages in Normal and five more in Hard, each in a different city, from Cologne to Vienna. You run as The DJ by default, or as one of the three other Cologne District players you pick on the screen of that district, each with their own outfit and trail. The scents are popular cologne notes such as Bergamot, Cedarwood, Sea Salt, Vetiver, Leather, Black Pepper and Tobacco, with the most popular ones showing up most often. Like the Perfume District, it is open from the start.</li><li>Four new players for the Perfume District only: The Sillage (a lingering scent trail collects items in lanes you just ran through), The Fixative (perfume power-ups last 5 seconds longer), The Decanter (stores a perfume cloud so you can release it when you want) and The Atomizer (every perfume cloud also blasts away the obstacles ahead). Choose one on the screen of that district. Each has five outfits and its own signature look and animated accessory, and there are six new perfume trails, all in the Cosmetics tab of the Mini Shop.</li><li>New Perfume District in City Tour. It is open from the start, and it is a special district with five stages in Normal and five more in Hard, each in a different city, from Grasse to Cannes. Perfume clouds are not obstacles. Run into them to activate a power-up. The scent is different almost every time you play, picked from sixteen popular scents such as Rose, Jasmine, Cherry Blossom, Citrus, Vanilla, Lavender, Amber, Sandalwood, Oud and Ocean Breeze. The voice tells you the scent when the stage starts, then names it and tells you which way to move as a cloud gets close. Each scent gives its own power-up.</li><li>Two bigger Trial Ticket packs in the Tickets tab of the Mini Shop: 5 tickets for 160 coins and 10 tickets for 300 coins, better value than the 1 for 40 and 3 for 100 deals.</li><li>Four more City Tour districts: Savanna Trail (Nairobi, Serengeti, Victoria Falls, Lagos, Johannesburg), Frozen North (Oslo, Helsinki, Tromso, Stockholm, Anchorage), Pacific Rim (Vancouver, Seattle, San Diego, Auckland, Melbourne) and Ancient Wonders (Athens, Petra, Luxor, Angkor, Samarkand). That makes twelve districts in all.</li><li>City Tour change: the next district now opens only after you clear all five Normal and all five Hard stages in the one before it. Districts you already started stay open.</li><li>Four new City Tour districts: Island Escape (Honolulu, Havana, Bali, Santorini, Zanzibar), Summit Range (Denver, Banff, Zermatt, Kathmandu, Cusco), Festival Quarter (New Orleans, Venice, Rome, Marrakech, Prague) and Neon Nights (Seoul, Hong Kong, Singapore, Taipei, Shanghai). Each has five stages and a Hard Mode, with its own city soundscape. They unlock one after another once you finish Sky District.</li><li>Themed Weekday Events: Mystery Mondays (transforming items), Turbo Tuesdays (faster runs, double coins), Wild Wednesdays (mega jackpots), Throwback Thursdays (retro soundscape and 8-bit sounds) and Frenzy Fridays (double power-up spawns). Each opens only on its day, by your device date, and locks again at midnight. Saturday plays the regular theme.</li><li>Bug fix: the Sunday Jackpot no longer makes low barriers harmless.</li><li>Holiday Lock: the Events tab now has the Sunday Jackpot, the weekday events and six holidays, the Fourth of July, Halloween, Christmas, New Year’s Day, Valentine’s Day and Easter. The old weekly events are gone. Holidays stay locked all year. On the day itself, by your device date, that holiday unlocks for 24 hours and locks the regular weekday theme, with its own soundscape on the menu and in your runs, triple coins and a one-time holiday gift. At midnight it locks again.</li><li>New Sunday Jackpot event. Every Sunday, by your device date, it unlocks in the Events tab. Beat your own best score in one run to win 2,500 coins, with a casino-style celebration. It locks again at midnight. Until Sunday you hear a clock ticking on the Events tab, and it ticks faster as Sunday gets closer. On Sunday the menu music switches to Golden Sunday.</li><li>City Tour fixes: progress saves more reliably, the result screen no longer lets swipes close the game, and a Trial Ticket comes back if a stage is interrupted.</li><li>More to unlock in the Cosmetics tab: four new Sound Packs (Drum Kit, Banjo Twang, Deep Sonar and Cartoon Boing), five new trails (Ember, Frost, Cherry Blossom, Lightning and Aurora), and two more outfits for each of the four newest players, so each now has five looks. 8-Bit Retro is there too, with a Preview button on every pack.</li><li>The four newest players, The Hacker, The DJ, The Free-Runner and The High Roller, now always run in a signature look with a matching trail. Four new animated trails were added: Matrix Rain, Disco, Comet and Lucky Chips. Two new switches in the Cosmetics tab: Style Match makes your trail take the colors of your outfit, and Outfit Shuffle wears a random outfit you own each run.</li><li>New Sound Packs in the Cosmetics tab of the Mini Shop: 8-Bit Retro, Space Laser, Bubble Pop and Piano Keys. They change your coin, jump and roll sounds, and you can preview each one before buying. Warning sounds for obstacles and enemies never change.</li><li>More cosmetics: five new trails (Glitch, Vinyl, Speedline, Cash and Starlight) and two extra outfits for each of the four new players, The Hacker, The DJ, The Free-Runner and The High Roller, so each now has three looks. Some outfits add a second ring.</li><li>New Music Theme Pack in Settings: choose the menu music from seven themes, Sunny Day, Retro Arcade, Tropical Beach, Space Journey, Jazz Lounge, Spooky Fun and Lo-fi Chill. The theme plays right away, and the style and volume sliders work with every theme.</li><li>New Cosmetics tab in the Mini Shop: five colored running trails and an alternate outfit for each of the nine characters. They only change how your runner looks on screen and never affect gameplay or sound.</li><li>New soft ambient music on the main menu. It lets you know the game has loaded, lowers itself whenever the narrator or screen reader speaks, and fades out when you start a run. It mixes calm ambient sound with a playful beat. In Settings you can slide the Music style between calm and fun, change the Music volume, or turn it off with Menu music.</li><li>Menu taps are less sensitive: a tap right after a screen change is ignored, and a double tap on the same button counts once.</li><li>New Daily Reward streak at the bottom of the main menu. Claim a different prize every day in a row: coins, Trial Tickets, or Standard, Nightmare and Labyrinth of Dread power-ups. Miss a day and the streak restarts. Rewards get better every week, with a jackpot on every seventh day.</li><li>The Mini Shop now has four tabs: Standard Power-Ups, Nightmare Power-Ups, Labyrinth of Dread Power-Ups and Tickets. You can now buy Purple Herb, Audio Decoy, Dash and Speed Pad, every Nightmare and Labyrinth power-up, and Trial Ticket packs.</li><li>Four new players: The Hacker (one free crash save per run), The DJ (a passive coin magnet), The Free-Runner (a score multiplier that builds as you run) and The High Roller (double coins and Mini Shop discounts, but one fewer life). Each ability is described on the Players screen.</li><li>New City Tour mode on the home screen, right below Easy, Medium and Hard. Explore four districts through finite stages with goals. Each stage needs a Trial Ticket, clearing every normal stage in a district unlocks its Hard Mode, and progress saves automatically. The City Event has been removed from Events.</li><li>What’s New now lives on the main menu, right below Settings.</li><li>New Store Hub on the main menu, right below the Casino Hub. The Mini Shop now lives inside it.</li><li>New Practice Hub on the main menu, right below the Challenge Hub. It opens a menu with the Practice Sound Room and, directly below it, Ask the Coach (hidden in the scary modes).</li><li>New menu order: Players, Events and the Casino Hub now come first under the modes. The Casino Hub opens a menu with the Lucky Wheel, Nightmare Wheel and Labyrinth Wheel. The Challenge Hub opens a menu with Trials, Missions and Levels.</li><li>Casino: two prize wheels for the scary modes. The Nightmare Wheel only awards Nightmare power-ups and the Labyrinth Wheel only awards Labyrinth power-ups, so the item pools stay completely separate. One free spin per wheel each day.</li><li>The Labyrinth of Dread is now easier: a slower pace, Mister Grin starts farther back and closes in more slowly, walls and ambushes cost less, and the maze has fewer junctions, dead ends and barriers.</li><li>New mode, The Labyrinth of Dread, right below Nightmare: an endless maze chase with Mister Grin, corner ambushes, dead-end hallucinations, and four exclusive power-ups: Phantom Compass, Decoy Flare, Wall Phase and Adrenaline Burst.</li><li>The Pogo Stick has been removed from the regular modes. If you had bought one, your 70 coins were refunded.</li><li>Nightmare Mode has just one enemy, Mister Grin. Ask the Coach is now only for the regular modes and is hidden in Nightmare.</li><li>Nightmare Mode is now completely separate: no trains, bouncy trains, speed pads, events or regular power-ups there, only foot running with crate walls and its own six power-ups. The regular modes never show the Nightmare power-ups.</li><li>Nightmare power-ups: in Nightmare Mode only, the Coin Magnet becomes the Whispering Balloon, the Score Booster becomes the Fear Meter, and Dash becomes Panic Sprint. Three rare new pickups help you survive Mister Grin: Spotlight Flash, Toy Boat Shield and Shadow Slide.</li><li>Nightmare Mode, right below Hard: a dark, high-stakes chase with its own eerie sound themes. Mister Grin, a clown with a machete, never stops chasing you. There are no lives, a stumble lets him catch up, and coins are worth double.</li><li>The Trials screen now shows a progress bar for every trial: your best attempt against the goal, plus the stars you have earned.</li><li>Trials now show a live progress bar during a run, with your goal progress and a second thin bar for the steps left. It appears only in trials.</li><li>Trials Mode: five short, objective-based runs on the home screen, such as Coin Dash and Smash Course. Earn up to three stars on each, separate from your missions.</li><li>Two new players: Orion, whose power-ups last half again as long, and Lyra, who is safe for three steps after a crash.</li><li>Three players to choose from on the new Players screen: Nova, Kestrel and Bruno. Each has a perk, a voice pitch and a start jingle.</li><li>Ask the Coach is back as a full-width button under the controls with VoiceOver on, in every mode.</li><li>Ask the Coach: the Ask screen no longer reads out the AI status by itself, and the microphone ignores the game’s own cue words.</li><li>New Game announcements setting: turns off the spoken pickups, crashes and stage themes during a run while keeping the Jump, Roll, Left and Right cues.</li><li>Audio Decoy: a tactical power-up that plants a false sound in a lane next to you and lures the hazards in your lane over to it. The voice tells you which side. Stay out of that lane until it ends.</li><li>New seasonal event: Harvest Fair, with warm market sounds and more Coin Magnets.</li><li>Two new seasonal events: Spring Bloom Festival, with more Purple Herbs, and Fireworks Night, with more Dash power-ups. Each has its own sound theme and joins the weekly rotation.</li><li>Purple Herb and Dash power-ups: the Purple Herb heals one life, or gives 10 coins if your lives are full. Dash bursts you forward at triple score through everything and collects coins from every lane.</li><li>Endless Mode: pick Endless on the home screen. There is no finish line. The track is built as you run, and the speed and number of hazards rise the longer you survive. Your score is the distance you cover, in meters.</li><li>Stomp Attack power-up: press Jump to slam the ground and smash every train and barrier close to you for 3 coins each. You get 3 stomps, and the voice says Stomp when one is in range. Also in the Mini Shop.</li><li>Battery power-up: charges your hoverboard with 20 more steps and one extra hit. If you have no hoverboard, it is saved for the next one. You can also buy it in the Mini Shop.</li><li>Ask the Coach now shows whether the AI is on, and has buttons to allow it or open its permissions.</li><li>Speed pads: a rising whoosh is a speed pad that makes you dash through everything at triple score.</li><li>Online backup: for players signed in to Claude with Contributor access, progress is also backed up online, so it survives app updates and clearing the phone’s browser data.</li><li>Bouncy trains: a springy boing means a safe train. Stay in its lane to bounce over it and earn 5 coins. The voice says Bounce.</li><li>Set your own username in Settings. It shows on the home screen and in the welcome greeting.</li><li>Mini Shop on the home screen: spend coins on power-ups and an extra life that start your next run.</li><li>Automatic saving: your coins, level, best score, missions and event progress save by themselves, even if you close the app mid-run.</li><li>Ask the Coach works during a run with VoiceOver on or off. With VoiceOver on, use the Ask the Coach button under the controls. With it off, tap Ask at the top of the screen. Say your question or tap a quick question like Where am I.</li><li>Quick pause and resume with VoiceOver off: a big Pause button, tap anywhere to resume, and the game pauses by itself if you leave the app.</li><li>Ask the Coach: ask a spoken question about your current city, hazards or power-ups and hear a short answer.</li><li>Practice Sound Room: press a sound to hear its name, then the sound. It covers power-ups, the security guard and his dog.</li><li>Weekly events with event tokens and a reward track.</li><li>With VoiceOver off: spoken cues for Jump, Roll, Left and Right, instant spoken confirmations, and tap anywhere to play again.</li><li>More lives: 5 on Easy, 4 on Medium and 3 on Hard. Zen has unlimited lives.</li></ul>'+BK;},

how:function(){var a=['Wear headphones. Obstacles come toward you in three lanes: left, middle and right. Their sounds pan to that side and get louder as they get close.','A low rumble is a train. Move to another lane.','A springy boing over a rumble is a bouncy train. It is safe: you bounce over it and earn 5 coins.','A rising whoosh is a speed pad. Run over it to dash at triple score through everything for a few steps. The voice says Speed.','Two low beeps are a low barrier. Press Jump.','A high whistle is an overhead bar. Press Roll.','A chime means a coin in that lane. A bell ring means an event token. A rising sparkle means a power-up. Be in the lane to collect it.','The voice coach says Jump, Roll, Left or Right a few steps before an obstacle reaches you. Turn it off in Settings.','Status reads your lane, score, coins and active power-ups. Pause stops the run. With VoiceOver off, Status and Pause are the buttons at the top of the screen.','Casino Hub: open the Casino Hub on the home screen for the Lucky Wheel and two prize wheels, and below them Mega Jackpot Slots, where you wager coins to win coins and a growing Mega Jackpot. The Nightmare Wheel only gives Nightmare power-ups, and the Labyrinth Wheel only gives Labyrinth of Dread power-ups. You get one free spin per wheel each day, then spins cost 100 coins. Prizes show up as pickups early in your next run of that mode.','Daily Reward: open Daily Reward at the bottom of the main menu once a day to claim a reward. Each day in a row gives a different prize: coins, Trial Tickets, or a random Standard, Nightmare or Labyrinth of Dread power-up, with a jackpot on day 7. Miss a day and your streak starts over. Rewards get better every week you keep it going.','City Tour: open City Tour on the home screen, right below Easy, Medium and Hard. Explore four districts, each with five stages and a goal, such as collecting coins or bouncing over trains. Every stage costs 1 Trial Ticket, returned the first time you clear it. You get 2 free tickets a day, and you can buy more in the Mini Shop inside the Store Hub. Clear all five Normal stages in a district to unlock its Hard Mode. Clear all five Hard stages to open the next district. Progress saves automatically.','Trials are short runs with one objective, separate from your missions. Open the Challenge Hub on the home screen, then Trials, finish faster for up to three stars, and earn coins for each new star.','Choose your player on the Players screen. The Hacker ignores your first crash each run and gets 20 percent more steps in regular City Tour districts, The Card Counter has better luck on the Lucky Wheel and always starts with a top-tier power-up, The Phantom drops your coins instead of crashing, The Free-Runner builds a score multiplier, and The High Roller doubles coins and gets Mini Shop discounts. Each has their own voice pitch and start jingle.','The Labyrinth of Dread: an endless maze right below Nightmare. You run forward nonstop while Mister Grin hunts you. At every junction, take the open lane: lanes with walls creak, and the open lane is silent. Beware: some openings are dead ends that seal shut, where he appears as a hallucination and the voice says Switch lanes. He also ambushes from corners, so listen for Ambush and move away. Coins work as usual. There are no trains and no regular power-ups, only the Phantom Compass, Decoy Flare, Wall Phase and Adrenaline Burst.','Nightmare Mode: a separate, high-stakes mode right below Hard. Mister Grin, a clown with a machete, chases you the whole way. You have no lives. The bar and the voice tell you how many steps behind you he is. A stumble lets him gain three steps, and if he reaches you the run is over. Coins and dodged obstacles push him back. This mode is foot running only, with no trains, vehicles, events or regular power-ups. Blocked lanes are walls of crates. The only power-ups are the Whispering Balloon, Fear Meter and Panic Sprint, plus the rare Spotlight Flash, Toy Boat Shield and Shadow Slide. Coins are worth double. Mister Grin is the only enemy here.','Easy: slow with five lives. Medium: normal with four lives. Hard: fast with three lives. Zen: no crashes, just calm running. Endless: no finish line. The track is built as you run and gets faster and busier the longer you survive, with three lives. Your score is the distance you cover. Use Pause then End run to finish.'],k,h='<h1 tabindex="-1">How to Play</h1>'+BK.replace('b_go_home','b_go_home_top')+'<ul>',i;
for(i=0;i<a.length;i++)h+='<li>'+a[i]+'</li>';h+='</ul><h2>Power-ups</h2><ul>';for(k in PW)h+='<li>'+PW[k].n+': '+PW[k].s+'</li>';return h+'</ul>'+BK;},
