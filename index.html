shop:function(){var h='<h1 tabindex="-1">Mini Shop</h1><p>You have '+S.coins+' coins. '+['Dark power-ups you buy are used automatically at the start of your next run, to help you survive the mansion and the Butcher.','Nightmare power-ups appear as pickups early in your next Nightmare run.','Labyrinth of Dread power-ups appear as pickups early in your next Labyrinth of Dread run.','Cursed Keys unlock the doors to haunted City Tour stages.','Haunted cosmetics only change how your runner looks on screen. They never change gameplay or sound. Each outfit is for one character. Press an item you own to equip or unequip it.','The Undertaker Vault is for those who dare to pay for dark treasure. It has bigger packs, bundles, and luxury outfits and trails for your front page players. Outfits and trails only change how your runner looks. Press an item you own to equip or unequip it.'][SHT]+((S.pl||0)===8?' Undertaker discount: 10 percent off.':'')+'</p><div role="group" aria-label="Shop categories">',T=['Dark Power-Ups','Nightmare Power-Ups','Labyrinth of Dread Power-Ups','Cursed Keys','Haunted Cosmetics','Undertaker Vault'],i,it,n,own,ow,eq;for(i=0;i<T.length;i++)h+=b('shtab',i,T[i],SHT===i);h+='</div>';if(SHT===4||SHT===5)h+=b('csm','','Style Match. Your trail takes the colors of your outfit.',!S.cs||S.cs.sm!==0)+b('csh','','Outfit Shuffle. Each run, you wear a random outfit you own for your character.',!!(S.cs&&S.cs.sh));for(i=0;i<SHOP.length;i++){it=SHOP[i];if(it.t!==SHT||it.cj)continue;if(it.cs){ow=!!(S.cs&&S.cs.own&&S.cs.own[it.k]);eq=it.k.indexOf('trail')===0?!!(S.cs&&S.cs.tr===it.k):it.sp?!!(S.cs&&S.cs.sp===it.k):!!(S.cs&&S.cs.ou&&S.cs.ou[it.pi]===it.oi);h+=b('buy',it.k,it.n+'. '+it.s+' '+(ow?'Owned. '+(eq?'Equipped. Press to unequip.':'Not equipped. Press to equip.'):sp(it)+' coins. Press to buy.'),ow?eq:undefined)+(it.sp?b('spv',it.k,'Preview '+it.n):'');continue;}if(it.vb){h+=b('buy',it.k,it.n+', '+(it.perk&&S.vp&&S.vp[it.k]?'owned. ':sp(it)+' coins. ')+it.s);continue;}n=it.n||PW[it.k].n;own=it.w?(casInv(it.w)[it.k]||0):it.k==='life'?(S.xl||0):it.k.indexOf('ticket')===0?(S.tt||0):((S.stock&&S.stock[it.k])||0);h+=b('buy',it.k,n+', '+sp(it)+' coins. '+(it.s||PW[it.k].s)+' You own '+own+'.');}return h+BK;},
whatsnew:function(){return '<h1 tabindex="-1">What’s New</h1>'+BK.replace('b_go_home','b_go_home_top')+'<h2>Important note about updates</h2><p>When a new version of Echo Runner is released, your browser may keep showing the older one. To get the latest version, refresh the page. If you open the game from your home screen or from a link inside another app, close it fully and open it again. If the game still looks the same, open it in Safari and refresh once more. Your progress is saved automatically, so you will not lose anything.</p><p>Echo Runner has had a whole revamp. Every monster now has its own catch sound, all rebuilt as layered horror sounds (you can turn them off in Settings). In the mansion modes (Easy, Medium, Hard, Endless and the City Tour), when the Butcher catches you, you hear heavy echoing footsteps on a marble floor, the metallic scrape of his huge knife dragging along the floor and walls, low guttural breathing and a slow deep thud, ending with a heavy knife slash. In The Nightmare Realm, when the Dream Demon catches you, you hear a layered horror sound: a deep guttural growl that turns into a high, distorted shriek, with wet clicking breathing, a low vibrating rumble, heavy reverb and a metallic echo. In Nightmare mode, when Mister Grin catches you, his raspy laugh jumps between a low wheeze and a high giggle over the heavy thud of oversized shoes running, with a warped music box and a faint wind-up toy squeak far behind. In The Labyrinth of Dread, his catch sound is different: a wheezing, distorted laugh echoes as if bouncing off distant maze walls, over frantic slapping of oversized shoes, while a warped music box and a metallic wind-up creak drift from side to side so you cannot tell where he is. In The Backrooms, when the Glitch Monster catches you, the sound is digital corruption in an office: stuttering static over the distorted clicking of a failing hard drive or keyboard, muffled footsteps on thin carpet, and a low electronic hum that pitches up as he reaches you. The Butcher now hunts you in every City Tour stage too, and each district has its own twist. Three new Butcher missions give Cursed Keys, the Undertaker Vault has a new Cold Sweat upgrade, and Settings has a Butcher speed option: Slow, Normal or Fast. The whole game now has a dark horror look: near-black screens, blood-red outlines and horror headings, with strong contrast kept for low-vision players. The game is now a horror game: a haunted mansion with a knife-wielding Butcher chasing you, haunted districts, scary holiday events, a scary menu soundscape and a dark Mini Shop, with the Nightmare and Dread mini games still as they were. Here is what changed.</p><ul><li>VoiceOver gate: a short screen before each mode, and before each district stage you press, tells you to turn VoiceOver off to play. The VoiceOver gate is only meant for blind players. It does not apply to visually impaired players. If you want to go back to the home page with VoiceOver turned off, you have to turn VoiceOver on to do so. Then press Back to home at the bottom.</li><li>New mini game: Run. It sits below The Fun House and is open from the start. One zombie chases you the whole way. All you hear is your own footsteps, the wind and its heavy footsteps behind you. The longer you survive, the louder and closer its heartbeat and groans get. There are no coins and no power-ups. Dodge using the sound of each obstacle.</li><li>The Fun House has a new obstacle: the ball pit. You hear rubber balls bouncing down one lane, faster and closer as they come, and the voice says Ball pit and the lane. Jump over them. If you run into them, you stumble and Jinx gains on you, but you never slow down. The Practice Sound Room has a new ball pit sound.</li><li>Nightmare mode now has a Christmas horror theme, inspired by the movie Terrifier 3. Its three stages are now the Frozen Christmas Carnival, the Tinsel Hall of Mirrors and The Toy Shop Basement, and Mister Grin is a grinning clown in a ragged holiday costume, now wearing a Santa hat. The Nightmare play screen is now red, white and dark green, with light falling snow. Only the names, descriptions and colors changed: all the sounds and the gameplay are exactly the same.</li><li>New mini game: The Fun House. It sits below The Unseen in the mode list and is open from the start. You are in a carnival fun house at night, chased by a clown named Jinx. You never hear him charge while you run, only warped carnival music, creaking boards and a faint giggle or dragging step behind you. Mirror panels, spinning barrels, trapdoors, swinging beams and tilting floors get in your way, and a glassy chime warns you when the mirrors are about to flip left and right. A fun house slide also appears now and then: three wooden clacks and a rising whistle warn you, then you speed up with a long whoosh and Jinx falls back, until a thump tells you that you have landed. A rotating tunnel also appears now and then: a rising hollow rumble warns you, then the voice says Roll and you crawl through it while a deep drum rumble spins around you. Stay low, or you stumble and Jinx gains on you. A bright gust tells you that you are through. When Jinx catches you, you hear him run at you, just like the end of Nightmare mode, and only then, at the very end. The Practice Sound Room has a Fun House group so you can hear everything first.</li><li>New mini game: The Unseen. It sits below The Nightmare Realm in the mode list and is open from the start. You never see what is chasing you. You run on foot, and the only way to know it is there is by listening. Footsteps and breathing move around you in stereo, and the closer and louder they get, the closer the danger is. When it catches you, you hear real, wordless, sickening sounds, and only then, at the very end. The Practice Sound Room has an Unseen group so you can hear them first.</li><li>New: my Echo Runner Discord community. You can find the link at the bottom of Settings. Join for feedback and updates.</li><li>The Practice Sound Room now names each mini game with its sounds: every Backrooms sound starts with “The Backrooms:”, every Nightmare Realm sound starts with “The Nightmare Realm:”, and the Nightmare sounds start with “Nightmare mode:”. The Nightmare group is now called Nightmare mode sounds and power-ups, and the How to Play entry for Nightmare Mode now describes its sounds.</li><li>The play screen in Easy, Medium, Hard, Endless and the City Tour now looks like a dark mansion hallway: wooden floorboards, candle-lit walls, doors, furniture, chandeliers, meat hooks, gold coins and pale grasping hands. The picture is also larger, and the “Theme undefined” text is gone.</li><li>New Catch sound switch in Settings: turn it on or off. When it is on, each mode plays its own catch sound: the Butcher in the mansion modes, Mister Grin in Nightmare mode and in The Labyrinth of Dread, the Glitch Monster in The Backrooms and the Dream Demon in The Nightmare Realm. When it is off, you only hear the spoken message. It is on by default, and it also applies to City Tour catches.</li><li>Newest changes: the Butcher’s end-of-run message now always says “The Butcher caught you”, and it is never cut off. A run now ends when you leave the play screen and pauses when you switch apps, so the game no longer keeps running without you. The City Tour has a longer head start before the Butcher begins to close in. Settings has a Test the voice button that plays a beep and speaks a test sentence, and the game now warns you if it is opened inside the Facebook or Instagram browser, where the built-in voice may stay silent. The Game version line was removed from Settings.</li><li>Renames: the Nightmare items are now the Music Box Shield and the Shadow Veil, and Thursday’s pickup is now a cursed relic.</li><li>The vehicles and ride-on items from other runner games, including bouncing obstacles, the hoverboard, jetpack, coin magnet, score booster, jump shoes and battery charger are gone, along with the Head Start Engine, and the power-up list is now all new. The locked door is the only lane-blocker now. The mansion now has its own obstacles: a toppled bookcase or grandfather clock to jump, and a swinging chandelier or dangling meat hook to roll under. A new hazard, the Grasping Hand, reaches up from the floor: dry scratching and a low groan means you can step over it for 5 coins. The Mystery Box stays, now renamed the Haunted Chest: a surprise pile of cursed coins. Monday’s event is now Bloodmoon Mondays, with extra Blood Vials.</li><li>If you owned any of the removed power-ups in the Mini Shop, you got your coins back. Events, the Mini Shop, daily offerings and the packs now use the remaining power-ups.</li><li>The Trials have been removed from the Challenge Hub. It now has only Missions and Levels.</li><li>Trial Tickets are now Cursed Keys. You use one to unlock a haunted City Tour stage, and you get it back the first time you clear that stage. The Tickets tab in the Mini Shop is now the Cursed Keys tab.</li><li>The security guard and his dog have been removed from the game, and from the Practice Sound Room. The Butcher is the only one chasing you in the standard modes now.</li><li>The Daily Reward is now the Nightly Offering. You survive nights in a row instead of days in a row, and night 7 gives the Grand Offering. The Lucky Wheel has been removed from the Casino Hub, along with the Wheel Pass. The Mega Jackpot is now the Devil’s Jackpot, with skull, bat, spider, candle, blood drop and devil symbols. Three Devils win the pot. Every other casino game is unchanged.</li><li>Scary events. The holidays are now six dark ones, each locked until its day: Halloween Night of Terror on October 31, Day of the Dead on November 1, Krampusnacht on December 5, The Longest Night on December 21, Walpurgis Night on April 30, and every Friday the 13th. Each has its own creepy soundscape, triple coins and a gift. The weekday events are now Bloodmoon Mondays, Terror Tuesdays, Witching Wednesdays, Thriller Thursdays and Fright Fridays, and Sunday plays Sacrifice Sunday.</li><li>The Mini Shop is now dark. New tabs: Dark Power-Ups, Haunted Cosmetics and the Undertaker Vault. Sound packs have haunted names, six new horror trails were added (Blood Drip, Bone Dust, Witch Brew, Ghost Mist, Coffin Wood and Rotten Pumpkin), and the cheerful trails and the Cartoon Boing pack were removed.</li><li>Missions are rewritten for the horror theme, and the City Tour stages have new dark names.</li><li>New: a huge mansion and a killer with a huge knife. In Easy, Medium, Hard and Endless, the Butcher chases you through the mansion. A distance bar shows how many steps behind you he is. He creeps closer every step, and every crash lets him gain two and a half steps. Collect coins and use Whispering Doll, Grave Smash, Terror Sprint or Phantom Form to push him back. If he catches you, the run is over. The City Tour, the Sunday Sacrifice and the mini games are not changed.</li><li>The Practice Hub is still on the main menu and opens the Practice Sound Room, which now has the Butcher’s footsteps, his dragging knife and the heartbeat sounds.</li><li>Zen mode has been removed. The Sunday Jackpot is now the Sunday Sacrifice. The menu music is now a scary soundscape: Haunted Mansion, Graveyard Fog, Music Box of the Dead and The Butchers Cellar.</li><li>Dark power-ups: Phantom Form, Salt Circle, Whispering Doll, Grave Smash, Blood Vial and Terror Sprint, plus the Fright Pad on the track. Grave Smash gives you four smashes, and Blood Vial also finds you 5 coins.</li><li>The City Tour keeps twelve districts, all with a scary makeover and new dark cities. The special districts have been removed completely.</li><li>Players have new dark names: Nyx, Raven, Grim, Morrow, Lenore, The Poltergeist, The Necromancer, The Revenant and The Undertaker. Their abilities are the same.</li><li>The Nightmare Realm now has a drowsiness meter. The longer you run, the sleepier you get, with a darkening, blurring screen and a Dream Demon that gains on you when you nearly fall asleep. Grab an Alarm Clock to wake yourself up. You will also hear whispers as it gets close, and the floor sometimes trembles with a low sound.</li><li>The Nightmare Realm is now much scarier, with the dread of a nightmare you cannot wake from. The Dream Demon chases faster, the screen turns red as it closes in, and you now hear hissing steam, dragging metal blades, pipe clangs and a slow music box lullaby as it gets near. There is also a new Boiler Room ambience.</li><li>A note about audio. When exiting the game, you may occasionally notice a temporary loss of audio. This can affect all sound elements, including in-game effects, background music, and footsteps. Please note that this is a known internet browser issue. If you experience this, simply refresh the page to fully restore your audio and continue playing.</li><li>A note on the inspiration behind the 2 new mini games. They come from two distinct eras of horror, blending modern psychological terror with classic slasher suspense. The Backrooms mini game draws directly from the recent film adaptation, capturing the eerie, endless, and isolating atmosphere of its liminal spaces. The Nightmare Realm mini game is heavily inspired by the original A Nightmare on Elm Street, channeling the frantic, dream-fueled terror of trying to stay awake while being relentlessly pursued by a malevolent entity.</li><li>The Sunday Sacrifice can now only be played when Endless mode is selected. Regular players only.</li><li>Holiday events and the Sunday Sacrifice are now only for regular players. The Backrooms players, the Nightmare Realm players and the district players cannot use them.</li><li>The Dreamscape mini game is now called The Nightmare Realm, and its chaser is now The Dream Demon. Its players are labeled Nightmare Realm only, and The Nightmare Realm and its casino are only for those players.</li><li>The Players screen now says much less: each player reads just a name and a short ability tag. Press Hear what the selected player does for the full details.</li><li>New casino game in the Casino Hub, right below the Glitch Reel: The Nightmare Realm Casino, only for Nightmare Realm players. Wager the Alarm Clocks you collect in The Nightmare Realm mini game on Dream Slots or Dream Roulette, ride the shifting tide, and use Lucid Speed, The Dreamcatcher and The Reality Anchor to shift the odds.</li><li>Four new players only for The Nightmare Realm mini game: The Insomniac, The Lucid Dreamer, The Dream Weaver and The Dream Warden, each with their own special abilities. They cannot play anywhere else, and regular players cannot enter The Nightmare Realm.</li><li>New mini game, The Nightmare Realm, below The Backrooms: an endless, shifting nightmare realm where the Dream Demon chases you. Dodge sudden nightmare traps, collect Alarm Clocks instead of coins to stay awake, and use three exclusive power-ups: Lucid Speed, The Dreamcatcher and The Reality Anchor. Every sound is unique, and the voice and bar keep you informed.</li><li>New player, The Scavenger, only for The Backrooms mini game: he collects more batteries than anyone. Double Haul counts every battery twice, and Battery Cache gives five bonus batteries on every eighth battery. Like the other Backrooms players, he cannot play anywhere else.</li><li>New casino game in the Casino Hub, below the Labyrinth Wheel: the Glitch Reel, a Backrooms mini game casino. Wager the batteries you collect in The Backrooms, not coins, and win Almond Water, Noclip Glitch, VCR Rewind, Echolocation Ping and the Static Walkie-Talkie. Match two reels, three reels, or get a Total Glitch for all five. Each prize has its own sound, and your winnings are used at the start of your Backrooms runs. Only the Backrooms players can play it.</li><li>The Backrooms is now labeled "mini game" on the home screen, so you know it is a separate mini game. The Players screen also no longer starts with the note about district players.</li><li>New player, The Night Janitor, only for The Backrooms mini game: Steady Light slows the Glitch Monster, Mop Bucket Map starts every run with an Echolocation Ping, and Spare Batteries gives a bonus battery and pushes the monster back every fifth battery. He cannot play anywhere else.</li><li>Two more Backrooms-only players. The Wanderer starts every run with Almond Water and keeps glitch anomalies from swapping lanes. The Technician collects batteries in the lanes next to him and gets a free VCR Rewind on the first crash of every run. Regular players are locked out of The Backrooms, and these players cannot play anywhere else.</li><li>New mini game, The Backrooms, below The Labyrinth of Dread: an endless, creepy office maze with a constant fluorescent hum, wet-carpet footsteps, a Glitch Monster chasing you, shifting walls, glitching anomalies, batteries instead of coins, and five exclusive power-ups: Almond Water, Noclip Glitch, VCR Rewind, Echolocation Ping and Static Walkie-Talkie. Every sound is unique, and the voice and bar keep you informed.</li><li>Footsteps now play in every mode: Easy, Medium, Hard, Endless, Nightmare and Labyrinth of Dread, and in all sixteen City Tour districts. Each regular district has its own ground: wooden boards in the Harbor District, cobbles in Old Town, metal grating in the Sky District, sand on Island Escape, gravel in the Summit Range, dry dirt on the Savanna Trail, squeaky snow in the Frozen North, and more. Steps are also louder than before.</li><li>The Card Counter plays an exciting fanfare when he wins big in Devil’s Jackpot Slots: a rising run of notes, a shower of sparkles and a big chord, with an even longer one for the Devil’s Jackpot.</li><li>The Card Counter now gets lucky in Devil’s Jackpot Slots. About one spin in seventeen is a guaranteed win for him, usually a pair, sometimes three of a kind, and very rarely the Devil’s Jackpot. The game announces it as a Lucky Streak.</li><li>New Undertaker Vault tab in the Mini Shop, for people who win big in the Casino Hub. It has bigger Cursed Key packs of 25 and 50, the Jackpot Power Pack, Lucky Seven Lives, the High Roller Mega Pack, luxury Golden outfits for all five front page players, and five new animated trails: Golden Cascade, Diamond Dust, Jackpot Rain, Platinum Comet and Devil’s Jackpot. There are also ultra luxury outfits for all five front page players, and four permanent upgrades you buy once: Golden Wallet (10 percent more coins from every run), Lucky Pair Charm (better pairs in Devil’s Jackpot Slots), and Salt Ward (every normal run starts with a Salt Circle). A fifth, Cold Sweat, makes the Butcher close in 15 percent slower.</li><li>New in the Casino Hub: Devil’s Jackpot Slots, in its own Coin casino section below the prize wheels. Wager 50, 100, 250 or 500 coins and win coins instead of power-ups. Three Devils win the Devil’s Jackpot, a pot that starts at 5000 coins and grows with every spin until someone hits it. Spend your winnings in the Mini Shop on outfits, trails, sounds, power-ups and Cursed Keys.</li><li>Two new players on the front page. The Card Counter has Lucky Streak: the first power-up you pick up in every run is always top-tier: Phantom Form, Salt Circle or Grave Smash. The Phantom is a glitchy, see-through runner with a Soft Crash: when you hit an obstacle while carrying coins, you drop all your coins from that run instead of crashing. Each has their own outfits and trails in the Cosmetics tab of the Mini Shop.</li><li>Players, Events, the Casino Hub, Store Hub, Challenge Hub, Practice Sound Room, How to Play, Settings and What’s New now each have their own Back to home button at the top, as well as at the bottom. You can get out without scrolling all the way down to go back to home.</li><li>The Poltergeist has a second special ability, Backdoor: in every regular City Tour district, each stage gives you 20 percent more steps to finish.</li><li>With VoiceOver on, Back to home and the other buttons on the Run over, Trial and Paused screens now only do what they say. They no longer start or resume a run.</li><li>The City Tour now has a back button at the top as well as the bottom.</li><li>Pause menu: End run now sits further from Resume, and tapping End run can no longer be treated as a tap to resume, so ending a run works in every mode and district.</li><li>The Mini Shop now has a Back to Store Hub button at the top as well as the bottom.</li><li>Bigger Pause: with VoiceOver off, Pause is now a large button across the top right of the screen, so tapping anywhere in the top right corner pauses the run. Status is the smaller button on the left.</li><li>Pause fix: found why Pause only worked sometimes. For under a second after you resumed a run, Pause was ignored. Now Pause works on the first tap at any moment of a run, including right after resuming.</li><li>Pause fix for VoiceOver off: the Pause button now pauses the moment you lift your finger on it, even when the phone does not send a normal tap, and it sits above everything else on the screen. Slide your finger away before lifting to cancel.</li><li>The front page now has only three players: The Poltergeist, The Revenant and The Undertaker. Nyx, Raven, Grim, Morrow, Lenore and The VJ were removed, along with their outfits and trails in the Mini Shop. If you were running as one of them, the game switches you to The Poltergeist.</li><li>Pause is now a single deliberate tap on the Pause button only, so it can no longer trigger by accident. The two-finger pause and the touch-down pause were removed because they were too sensitive. The Status and Pause row stays lowered away from the top edge of the phone, so it does not clash with the notification center swipe.</li><li>With the built-in voice, the Status and Pause buttons now sit lower on the run screen, away from the very top edge of the phone, so they are easier to reach and tap. Pause is also faster to respond.</li><li>Ask the Coach has been removed from the whole game, including the Practice Sound Room, the pause menu and the run screen, because it got in the way of the Pause button for blind and low-vision players. The Pause button now sits right next to Status. The Voice coach setting, which speaks cues during a run, is not affected.</li><li>New Retro Arcade District in City Tour, with five stages in Normal and five in Hard in Akihabara, Brighton, Santa Monica, Busan and Leipzig. The obstacles are arcade machines. Four new players for this district only, chosen on the district screen: The High Scorer (a speed boost every 12 coins), The Pixel (phases through barriers for 4 steps every 16 steps), The Joystick (safe for one step after every lane change) and The Glitch (scrambles nearby obstacles every 12 steps). Each has five outfits, a signature look and four new trails in the Cosmetics tab of the Mini Shop.</li><li>Two bigger Cursed Key packs in the Cursed Keys tab of the Mini Shop: 5 keys for 160 coins and 10 keys for 300 coins, better value than the 1 for 40 and 3 for 100 deals.</li><li>Four more City Tour districts: Savanna Trail (Nairobi, Serengeti, Victoria Falls, Lagos, Johannesburg), Frozen North (Oslo, Helsinki, Tromso, Stockholm, Anchorage), Pacific Rim (Vancouver, Seattle, San Diego, Auckland, Melbourne) and Ancient Wonders (Athens, Petra, Luxor, Angkor, Samarkand). That makes twelve districts in all.</li><li>City Tour change: the next district now opens only after you clear all five Normal and all five Hard stages in the one before it. Districts you already started stay open.</li><li>Themed Weekday Events: Bloodmoon Mondays (transforming items), Terror Tuesdays (faster runs, double coins), Witching Wednesdays (devil’s jackpots), Thriller Thursdays (retro soundscape and 8-bit sounds) and Fright Fridays (double power-up spawns). Each opens only on its day, by your device date, and locks again at midnight. Saturday plays the regular theme.</li><li>Bug fix: the Sunday Sacrifice no longer makes low tombstones harmless.</li><li>New Sunday Sacrifice event. Every Sunday, by your device date, it unlocks in the Events tab. Beat your own best score in one run to win 2,500 coins, with a casino-style celebration. It locks again at midnight. Until Sunday you hear a clock ticking on the Events tab, and it ticks faster as Sunday gets closer. On Sunday the menu music switches to Sacrifice Sunday.</li><li>City Tour fixes: progress saves more reliably, the result screen no longer lets swipes close the game, and a Cursed Key comes back if a stage is interrupted.</li><li>More to unlock in the Cosmetics tab: four new Sound Packs (Drum Kit, Banjo Twang, Deep Sonar and Cartoon Boing), five new trails (Ember, Frost, Cherry Blossom, Lightning and Aurora), and two more outfits for each of the four newest players, so each now has five looks. 8-Bit Retro is there too, with a Preview button on every pack.</li><li>The four newest players, The Poltergeist, The Necromancer, The Revenant and The Undertaker, now always run in a signature look with a matching trail. Four new animated trails were added: Matrix Rain, Disco, Comet and Lucky Chips. Two new switches in the Cosmetics tab: Style Match makes your trail take the colors of your outfit, and Outfit Shuffle wears a random outfit you own each run.</li><li>New Sound Packs in the Cosmetics tab of the Mini Shop: 8-Bit Retro, Space Laser, Bubble Pop and Piano Keys. They change your coin, jump and roll sounds, and you can preview each one before buying. Warning sounds for obstacles and enemies never change.</li><li>More cosmetics: five new trails (Glitch, Vinyl, Speedline, Cash and Starlight) and two extra outfits for each of the four new players, The Poltergeist, The Necromancer, The Revenant and The Undertaker, so each now has three looks. Some outfits add a second ring.</li><li>New Music Theme Pack in Settings: choose the menu music from seven themes, Sunny Day, Retro Arcade, Tropical Beach, Space Journey, Jazz Lounge, Spooky Fun and Lo-fi Chill. The theme plays right away, and the style and volume sliders work with every theme.</li><li>New Cosmetics tab in the Mini Shop: five colored running trails and an alternate outfit for each of the nine characters. They only change how your runner looks on screen and never affect gameplay or sound.</li><li>New soft ambient music on the main menu. It lets you know the game has loaded, lowers itself whenever the narrator or screen reader speaks, and fades out when you start a run. It mixes calm ambient sound with a playful beat. In Settings you can slide the Music style between calm and fun, change the Music volume, or turn it off with Menu music.</li><li>Menu taps are less sensitive: a tap right after a screen change is ignored, and a double tap on the same button counts once.</li><li>New Daily Reward streak at the bottom of the main menu. Claim a different prize every day in a row: coins, Cursed Keys, or Standard, Nightmare and Labyrinth of Dread power-ups. Miss a day and the streak restarts. Rewards get better every week, with a jackpot on every seventh day.</li><li>The Mini Shop now has four tabs: Standard Power-Ups, Nightmare Power-Ups, Labyrinth of Dread Power-Ups and Cursed Keys. You can now buy Blood Vial, Whispering Doll, Terror Sprint and Fright Pad, every Nightmare and Labyrinth power-up, and Cursed Key packs.</li><li>New City Tour mode on the home screen, right below Easy, Medium and Hard. Explore four districts through finite stages with goals. Each stage needs a Cursed Key, clearing every normal stage in a district unlocks its Hard Mode, and progress saves automatically. The City Event has been removed from Events.</li><li>What’s New now lives on the main menu, right below Settings.</li><li>New Store Hub on the main menu, right below the Casino Hub. The Mini Shop now lives inside it.</li><li>New menu order: Players, Events and the Casino Hub now come first under the modes. The Casino Hub opens a menu with the Nightmare Wheel and Labyrinth Wheel. The Challenge Hub opens a menu with Missions and Levels.</li><li>Casino: two prize wheels for the scary modes. The Nightmare Wheel only awards Nightmare power-ups and the Labyrinth Wheel only awards Labyrinth power-ups, so the item pools stay completely separate. One free spin per wheel each day.</li><li>The Labyrinth of Dread is now easier: a slower pace, Mister Grin starts farther back and closes in more slowly, walls and ambushes cost less, and the maze has fewer junctions, dead ends and barriers.</li><li>New mode, The Labyrinth of Dread, right below Nightmare: an endless maze chase with Mister Grin, corner ambushes, dead-end hallucinations, and four exclusive power-ups: Phantom Compass, Decoy Flare, Wall Phase and Adrenaline Burst.</li><li>The Pogo Stick has been removed from the regular modes. If you had bought one, your 70 coins were refunded.</li><li>Nightmare Mode has just one enemy, Mister Grin. Ask the Coach is now only for the regular modes and is hidden in Nightmare.</li><li>Nightmare Mode, right below Hard: a dark, high-stakes chase with its own eerie sound themes. Mister Grin, a clown with a machete, never stops chasing you. There are no lives, a stumble lets him catch up, and coins are worth double.</li><li>The Trials screen now shows a progress bar for every trial: your best attempt against the goal, plus the stars you have earned.</li><li>Trials now show a live progress bar during a run, with your goal progress and a second thin bar for the steps left. It appears only in trials.</li><li>Trials Mode: five short, objective-based runs on the home screen, such as Soul Dash and Smash Course. Earn up to three stars on each, separate from your missions.</li><li>Two new players: Morrow, whose power-ups last half again as long, and Lenore, who is safe for three steps after a crash.</li><li>Three players to choose from on the new Players screen: Nyx, Raven and Grim. Each has a perk, a voice pitch and a start jingle.</li><li>Ask the Coach is back as a full-width button under the controls with VoiceOver on, in every mode.</li><li>Ask the Coach: the Ask screen no longer reads out the AI status by itself, and the microphone ignores the game’s own cue words.</li><li>New Game announcements setting: turns off the spoken pickups, crashes and stage themes during a run while keeping the Jump, Roll, Left and Right cues.</li><li>Whispering Doll: a tactical power-up that plants a false sound in a lane next to you and lures the hazards in your lane over to it. The voice tells you which side. Stay out of that lane until it ends.</li><li>Two new seasonal events: Spring Bloom Festival, with more Blood Vials, and Fireworks Night, with more Terror Sprint power-ups. Each has its own sound theme and joins the weekly rotation.</li><li>Blood Vial and Terror Sprint power-ups: the Blood Vial heals one life, or gives 10 coins if your lives are full. Terror Sprint bursts you forward at triple score through everything and collects coins from every lane.</li><li>Endless Mode: pick Endless on the home screen. There is no finish line. The track is built as you run, and the speed and number of hazards rise the longer you survive. Your score is the distance you cover, in meters.</li><li>Grave Smash power-up: press Jump to slam the ground and smash every locked door and tombstone close to you for 3 coins each. You get 3 stomps, and the voice says Stomp when one is in range. Also in the Mini Shop.</li><li>Ask the Coach now shows whether the AI is on, and has buttons to allow it or open its permissions.</li><li>Fright pads: a rising whoosh is a fright pad that makes you dash through everything at triple score.</li><li>Online backup: for players signed in to Claude with Contributor access, progress is also backed up online, so it survives app updates and clearing the phone’s browser data.</li><li>Set your own username in Settings. It shows on the home screen and in the welcome greeting.</li><li>Mini Shop on the home screen: spend coins on power-ups and an extra life that start your next run.</li><li>Automatic saving: your coins, level, best score, missions and event progress save by themselves, even if you close the app mid-run.</li><li>Ask the Coach works during a run with VoiceOver on or off. With VoiceOver on, use the Ask the Coach button under the controls. With it off, tap Ask at the top of the screen. Say your question or tap a quick question like Where am I.</li><li>Quick pause and resume with VoiceOver off: a big Pause button, tap anywhere to resume, and the game pauses by itself if you leave the app.</li><li>Ask the Coach: ask a spoken question about your current city, hazards or power-ups and hear a short answer.</li><li>Practice Sound Room: press a sound to hear its name, then the sound. It covers power-ups and the locked doors.</li><li>Weekly events with event tokens and a reward track.</li><li>With VoiceOver off: spoken cues for Jump, Roll, Left and Right, instant spoken confirmations, and tap anywhere to play again.</li><li>More lives: 5 on Easy, 4 on Medium and 3 on Hard.</li></ul>'+BK;},

events:function(){var h='<h1 tabindex="-1">Events</h1>'+((brp()||drp())?'<p>Holiday events and the Sunday Sacrifice are only for regular players. '+PL[S.pl].n+' can only play '+lockN()+'. Choose a regular player in Players to use them.</p>':'')+jpBlock()+'<h2>Today’s soundscape</h2><p>Events and themes only change the standard modes: Easy, Medium, Hard and Endless. Nightmare, Labyrinth of Dread, The Backrooms and The Nightmare Realm are completely separate and never change. </p><p>'+(holNow()>=0?EV[holNow()].n+' is open, so the regular theme and the weekday event are locked until midnight.':wdNow()?WDE[wdNow()].n+' is open, so the regular theme is locked until midnight.':isSun()?'It is Sunday, so the regular theme is locked and Sacrifice Sunday plays until midnight.':'It is Saturday, so the regular theme plays.')+'</p>'+wdBlock()+holBlock()+'<p>Event tokens collected: '+S.tk+'. '+(RT[S.cl]?'Next reward at '+RT[S.cl].n+' tokens: '+RT[S.cl].t+'.':'All rewards unlocked.')+' Event tokens ring like a bell and appear in your lanes while a holiday event is open.</p><h2>Reward track</h2><ul>',i;for(i=0;i<RT.length;i++)h+='<li>'+RT[i].n+' tokens: '+RT[i].t+(i<S.cl?'. Unlocked.':'.')+'</li>';return h+'</ul>'+'<p>'+(S.ev>=0?EV[S.ev].n+': '+EV[S.ev].s:'No holiday event is open today.')+'</p>'+BK;},
dcasino:function(){var h='<h1 tabindex="-1">The Nightmare Realm Casino</h1><p>A dream casino only for Nightmare Realm players. Wager the Alarm Clocks you collected in The Nightmare Realm mini game, and try to outlast the Dream Demon nightmare traps. Play Dream Slots or Dream Roulette. In the slots, a pair pays 1.5 times, three of a kind pays 3 times, and three Alarm Clocks win the Dream Jackpot at 10 times. In the roulette, bet Wake or Sleep to win 2 times, or bet Dream to win 19 times. The tide shifts every spin and changes your winnings: Ebb is times 0.8, Calm is times 1, and Surge is times 1.25. A losing spin springs a nightmare trap and you lose your wager. You have '+(S.alc||0)+' alarm clocks.</p><p>Active power-ups: '+dcAct()+'.</p>'+(dcP().anchor>0?'<p>The Reality Anchor highlights the best payout: bet Dream in the roulette for 19 times, or hunt the Dream Jackpot in the slots, both times 1.25 with the tide locked at Surge.</p>':'')+'<div role="group" aria-label="Wager">',i;

glitch:function(){var h='<h1 tabindex="-1">Glitch Reel</h1><p>A Backrooms casino game, only for Backrooms players: The Night Janitor, The Wanderer, The Technician and The Scavenger. Wager batteries, not coins. Match two reels to win one Backrooms power-up, match three to win three, and a Total Glitch of three swirling reels wins all five. No match, and the batteries are lost. A bigger wager multiplies the prize: 3 batteries is times 1, 6 is times 2, and 12 is times 4. The five power-ups are Almond Water, Noclip Glitch, VCR Rewind, Echolocation Ping and the Static Walkie-Talkie. They only work in The Backrooms mini game, and one of each you own is used at the start of every Backrooms run. Batteries come from playing The Backrooms mini game.</p><p>You have '+(S.bat||0)+' batteries. Power-ups waiting: '+grList()+'.</p><div role="group" aria-label="Wager">',i;for(i=0;i<GRW.length;i++)h+=b('gw',GRW[i],'Wager '+GRW[i]+' batteries',grWg()===GRW[i]);h+='</div><p id="grr" aria-hidden="true">'+(GRLR?'':'?  ?  ?')+'</p>'+(GRLR?'<p>Last spin: '+GRLR+'</p>':'')+b('gsp','','Spin for '+grWg()+' batteries')+BK;return h;},
megaj:function(){var h='<h1 tabindex="-1">Devil’s Jackpot Slots</h1><p>Wager coins and win coins from the devil himself. Match three symbols to win big. Three Devils win the Devil’s Jackpot, which grows with every spin until someone hits it. Any pair gives you a little extra back. Win coins to spend in the Undertaker Vault in the Mini Shop, and everywhere else in the Mini Shop too. You have '+S.coins+' coins.'+((S.pl||0)===29?' Playing as The Card Counter, you get lucky now and then: about one spin in seventeen is a guaranteed win.':'')+'</p><p>The Devil’s Jackpot is '+mjPot()+' coins.'+(S.mjn?' You have won it '+S.mjn+(S.mjn>1?' times.':' time.'):'')+'</p><div role="group" aria-label="Wager">',i;for(i=0;i<MJW.length;i++)h+=b('mjw',MJW[i],'Wager '+MJW[i]+' coins',mjWg()===MJW[i]);h+='</div><p id="mjr" aria-hidden="true">'+(MJLR?'':'?  ?  ?')+'</p>'+(MJLR?'<p>Last spin: '+MJLR+'</p>':'')+b('mjs','','Spin for '+mjWg()+' coins')+b('vault','','Spend winnings in the Undertaker Vault')+BK;return h;},
how:function(){var a=['Wear headphones. Obstacles come toward you in three lanes: left, middle and right. Their sounds pan to that side and get louder as they get close.','A heavy knock and a creak is a locked door. Move to another lane.','Dry scratching and a low groan is a Grasping Hand reaching up from the floor. It is safe: you step over it and earn 5 coins.','The Butcher: in Easy, Medium, Hard and Endless you are trapped in a huge mansion, and a killer with a huge knife is hunting you. The distance bar shows how many steps behind you he is. Listen for his heavy footsteps, the knife dragging along the floor and your own heartbeat. He gains a little every step and a lot when you crash. Coins and power-ups like Whispering Doll, Grave Smash and Terror Sprint push him back. If he reaches you, the run is over.','A rising whoosh is a fright pad. Run over it to dash at triple score through everything for a few steps. The voice says Speed.','A heavy thud and falling books is a toppled bookcase. A thud and a single bell chime is a toppled grandfather clock. Press Jump for either one.','A creak and falling crystal is a swinging chandelier. A metal squeal and a scrape is a dangling meat hook. Press Roll for either one.','A chime means a coin in that lane. A bell ring means an event token. A rising sparkle means a power-up. Be in the lane to collect it.','The voice coach says Jump, Roll, Left or Right a few steps before an obstacle reaches you. Turn it off in Settings.','Status reads your lane, score, coins and active power-ups. Pause stops the run. With VoiceOver off, Status and Pause are the buttons at the top of the screen.','Casino Hub: open the Casino Hub on the home screen for the Nightmare Wheel and the Labyrinth Wheel, and below them Devil’s Jackpot Slots, where you wager coins to win coins and a growing Devil’s Jackpot. The Nightmare Wheel only gives Nightmare power-ups, and the Labyrinth Wheel only gives Labyrinth of Dread power-ups. You get one free spin per wheel each day, then spins cost 100 coins. Prizes show up as pickups early in your next run of that mode.','Nightly Offering: open Nightly Offering at the bottom of the main menu once a night to claim the dark’s offering. Each night in a row gives a different prize: coins, Cursed Keys, or a random dark, Nightmare or Labyrinth of Dread power-up, with the Grand Offering on night 7. Miss a night and the dark takes your streak. Offerings get better every week you survive.','City Tour: open City Tour on the home screen, right below Easy, Medium and Hard. Explore twelve haunted districts: Hollow Downtown, Drowned Harbor, Haunted Old Town, Gargoyle Spires, Isle of the Lost, Howling Peaks, Carnival of Screams, Flicker District, Bone Savanna, Frostbitten North, Fog Coast and Cursed Ruins. Each district has five Normal stages and five Hard stages in five dark cities, each with a goal, such as collecting coins or hopping over locked doors. Clear a district to open the next one.','Regular players: choose your player on the Players screen. They run in regular runs and regular City Tour districts, and each has their own voice pitch and start jingle. The Poltergeist has Noclip, which ignores your first crash each run, and Backdoor, which gives every regular City Tour stage 20 percent more steps. The Revenant has Momentum, so your score multiplier builds as you run without crashing: times 2 after 8 steps, times 3 after 20, and times 4 after 36. A crash resets it. The Undertaker doubles every coin you collect and gets 10 percent off Mini Shop prices, but starts each run with one fewer life. The Card Counter has Lucky Streak: better luck in Devil’s Jackpot Slots, and the first power-up you pick up each run is top-tier. The Phantom has Soft Crash: when you hit an obstacle while carrying coins, you drop them instead of crashing, and with no coins a crash is normal.','Glitch Reel: open the Casino Hub and find the Mini game casinos, below the Labyrinth Wheel. It is only for Backrooms players, so choose The Night Janitor, The Wanderer, The Technician or The Scavenger in Players first. Wager batteries you collected in The Backrooms mini game, not coins. Match two reels for one Backrooms power-up, three for three, and a Total Glitch wins all five. A bigger wager multiplies the prize, and no match loses the batteries. The power-ups you win, Almond Water, Noclip Glitch, VCR Rewind, Echolocation Ping and Static Walkie-Talkie, only work in The Backrooms, and one of each is used at the start of every Backrooms run. Each power-up has its own sound, and the voice reads every spin.','The Nightmare Realm Casino: open the Casino Hub and find The Nightmare Realm Casino, right below the Glitch Reel. It is only for the four Nightmare Realm players. Wager the Alarm Clocks you collected in The Nightmare Realm mini game, not coins. Play Dream Slots, where a pair pays 1.5 times, three of a kind pays 3 times and three Alarm Clocks win the Dream Jackpot at 10 times, or Dream Roulette, where Wake or Sleep pays 2 times and Dream pays 19 times. The tide shifts every spin: Ebb is times 0.8, Calm is times 1 and Surge is times 1.25. A losing spin springs a nightmare trap and you lose your wager. Spend alarm clocks on three power-ups: Lucid Speed speeds up the spins and gives a losing spin a second chance, The Dreamcatcher absorbs one losing bet, and The Reality Anchor locks the tide at Surge. Every spin has its own sounds, and the voice reads each result.','Nightmare Realm players: four players are only for The Nightmare Realm mini game, and they cannot play anywhere else. The Insomniac has Wide Awake, which makes every Alarm Clock push the Dream Demon back three times as far, and Night Owl, which slows the Dream Demon. The Lucid Dreamer starts every run with Lucid Speed and has Dream Control, which turns the first hit of every run to mist. The Dream Weaver starts every run with The Dreamcatcher and has Steady Threads, so half of the shifting walls stay put. The Dream Warden has Trap Sense, so nightmare traps appear two steps earlier, and starts every run with The Reality Anchor. Regular players cannot enter The Nightmare Realm, so you must choose one of them in Players first.','Backrooms players: four players are only for The Backrooms mini game, and they cannot play anywhere else. Regular players cannot enter The Backrooms, so you must choose one of them in Players first. The Night Janitor has Steady Light, which slows the Glitch Monster, Mop Bucket Map, which starts every run with an Echolocation Ping, and Spare Batteries, which gives a bonus battery and pushes the monster back every fifth battery. The Wanderer starts every run with Almond Water and has Glitch Sight, so glitch anomalies cannot swap lanes. The Technician has Battery Hound, which collects batteries in the lanes next to him, and Emergency Rewind, a free VCR Rewind on the first crash of every run. The Scavenger collects the most batteries: Double Haul counts every battery twice, and Battery Cache gives five bonus batteries on every eighth battery.','The Backrooms: an endless office maze right below The Labyrinth of Dread. Fluorescent lights hum, wet carpet squelches, and the Glitch Monster chases you. The bar and the voice tell you how many steps behind it is. Walls block the lanes and one lane is always open, which is silent. Some walls shift: the voice says Shift left or Shift right and the open lane moves. Glitch anomalies buzz with static and swap lanes, so dodge them. Collect batteries instead of coins. The five power-ups are Almond Water, Noclip Glitch, VCR Rewind, Echolocation Ping and the Static Walkie-Talkie.','The Nightmare Realm: a mini game right below The Backrooms, only for the four Nightmare Realm players. You are trapped in an endless, shifting nightmare realm, chased by the Dream Demon. The bar and the voice tell you how far behind he is. Walls of dream fog block the lanes and one lane is always open, and some walls shift, with the voice saying Shift left or Shift right. Nightmare traps appear suddenly with a music box sting and the voice says Trap, so switch lanes fast. Collect Alarm Clocks instead of coins to stay awake: each one also pushes the Dream Demon back. There are three exclusive power-ups. Lucid Speed gives a massive burst of speed and turns traps and walls into mist. The Dreamcatcher is a shield that absorbs one hit. The Reality Anchor briefly stops the shifting and highlights the safest path, with a chime and the voice saying Left or Right.','The Labyrinth of Dread: an endless maze right below Nightmare. You run forward nonstop while Mister Grin hunts you. At every junction, take the open lane: lanes with walls creak, and the open lane is silent. Beware: some openings are dead ends that seal shut, where he appears as a hallucination and the voice says Switch lanes. He also ambushes from corners, so listen for Ambush and move away. Coins work as usual. There are no locked doors and no regular power-ups, only the Phantom Compass, Decoy Flare, Wall Phase and Adrenaline Burst.','Nightmare Mode: a separate, high-stakes mode right below Hard. It has a Christmas horror theme, inspired by the movie Terrifier 3. Mister Grin, a grinning clown in a ragged holiday costume and a Santa hat, with a machete, chases you through a twisted Christmas carnival on a snowy night. The play screen is red, white and dark green, with light falling snow. The three stages are the Frozen Christmas Carnival, the Tinsel Hall of Mirrors and The Toy Shop Basement. You have no lives. The bar and the voice tell you how many steps behind you he is. A stumble lets him gain three steps, and if he reaches you the run is over. Coins and dodged obstacles push him back. This mode is foot running only, with no locked doors, vehicles, events or regular power-ups. Blocked lanes are walls of crates. Nightmare sounds: Mister Grin runs in heavy oversized shoes that get louder as he closes in, his machete scrapes along the ground, and he laughs when he is very close. When he catches you, you hear his raspy laugh, the thud of his shoes, a warped music box and a wind-up toy squeak. The Practice Sound Room has all of these. The only power-ups are the Whispering Balloon, Fear Meter and Panic Sprint, plus the rare Spotlight Flash, Music Box Shield and Shadow Veil. Coins are worth double. Mister Grin is the only enemy here.','Easy: slow with five lives. Medium: normal with four lives. Hard: fast with three lives. Endless: no finish line. The track is built as you run and gets faster and busier the longer you survive, with three lives. Your score is the distance you cover. Use Pause then End run to finish.'],k,h='<h1 tabindex="-1">How to Play</h1>'+BK.replace('b_go_home','b_go_home_top')+'<ul>',i;
a.push('The Unseen is a horror mini game where you never see what is chasing you. You run on foot, and the only way to know it is there is by listening. Footsteps and breathing move around you in stereo, and the closer and louder they get, the closer the danger is. Dodge the obstacles to keep your distance. If it catches you, you hear real, wordless, sickening sounds, and only then, at the very end. There are no power-ups, and it is open from the start.');a.push('The Fun House is a horror mini game set in a carnival fun house at night. A clown named Jinx is chasing you, and you never hear him charge while you run. You only hear warped carnival music, creaking boards and, now and then, a faint squeaky giggle or a slow dragging step behind you. Dodge mirror panels, spinning barrels, trapdoors, swinging beams and tilting floors. A glassy chime warns you that the mirrors are about to flip. For a few steps after it, the sounds come from the opposite side, so left sounds like right. Now and then you hear three wooden clacks and a rising whistle: a slide is coming. On the slide you speed up with a long whoosh, so obstacles arrive faster, but Jinx falls back behind you. A thump tells you when you land. A rising hollow rumble and the words Spinning tunnel mean a rotating tunnel is ahead. When the voice says Roll, press Roll and stay low for the few steps you crawl through it, with a deep drum rumble spinning around you. If you stand up inside, you stumble and Jinx gains on you. A bright gust means you are through. Now and then a ball pit also appears: you hear rubber balls bouncing down one lane, faster and closer as they come, and the voice says Ball pit and the lane. Jump over them. If Jinx catches you, you hear him run at you, the same catch sound as the end of Nightmare mode, and only then, at the very end. There are no power-ups, and it is open from the start.');a.push('Run is a horror mini game with one zombie and almost no other sound. You hear only your own footsteps, the wind, and the zombie heavy, distorted footsteps right behind you. The longer you survive, the louder and closer its heartbeat and groans get. There are no coins and no power-ups, so all you do is dodge by listening to where each obstacle is. If it catches you, you hear it lunge and groan, only at the very end. It is open from the start.');for(i=0;i<a.length;i++)h+='<li>'+a[i]+'</li>';h+='</ul><h2>Power-ups</h2><ul>';for(k in PW)h+='<li>'+PW[k].n+': '+PW[k].s+'</li>';return h+'</ul>'+BK;},
